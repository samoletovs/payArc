name: CI Auto-Remediation

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: ci-auto-remediate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  remediate-known-failures:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout failed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download failed job logs
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-logs
          gh api "repos/${REPO}/actions/runs/${RUN_ID}/logs" > /tmp/ci-logs/run-logs.zip
          unzip -o /tmp/ci-logs/run-logs.zip -d /tmp/ci-logs/unzipped > /dev/null
          cat /tmp/ci-logs/unzipped/*.txt > /tmp/ci-logs/all.log || true

      - name: Classify deterministic pattern
        id: classify
        run: |
          set -euo pipefail
          PATTERN="none"
          if grep -Eq "npm ci can only install packages when your package\.json and package-lock\.json|npm ERR! code EUSAGE" /tmp/ci-logs/all.log; then
            PATTERN="npm-lockfile-mismatch"
          fi
          echo "pattern=${PATTERN}" >> "$GITHUB_OUTPUT"

      - name: Skip repeated retries for same SHA
        id: retryguard
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = "${{ github.event.workflow_run.head_sha }}";
            const branch = `auto/remediate-${sha}`;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'all', head: `${owner}:${branch}`, per_page: 100
            });
            const alreadyHandled = prs.length > 0;
            core.setOutput('skip', alreadyHandled ? 'true' : 'false');
            core.info(alreadyHandled ? `Skipping: existing remediation PR for ${sha}` : `No prior remediation PR for ${sha}`);

      - name: Apply deterministic fix
        if: steps.classify.outputs.pattern == 'npm-lockfile-mismatch' && steps.retryguard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json in repo at failed SHA; skipping fix."
            exit 0
          fi
          npm install --package-lock-only

      - name: Skip if no changes or no deterministic fix
        id: diffcheck
        run: |
          set -euo pipefail
          if [ "${{ steps.classify.outputs.pattern }}" = "none" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.retryguard.outputs.skip }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update remediation PR
        if: steps.diffcheck.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/remediate-${{ github.event.workflow_run.head_sha }}
          commit-message: "chore: auto-remediate CI failure (${{ steps.classify.outputs.pattern }})"
          title: "chore: auto-remediate CI failure (${{ steps.classify.outputs.pattern }})"
          body: |
            Automated remediation for failed CI run.

            - Source run: ${{ github.event.workflow_run.html_url }}
            - Source SHA: `${{ github.event.workflow_run.head_sha }}`
            - Detected pattern: `${{ steps.classify.outputs.pattern }}`

            This PR is generated only for deterministic known-failure signatures.
          labels: |
            automation
            auto-remediation
          delete-branch: false

      - name: Summary
        run: |
          echo "pattern=${{ steps.classify.outputs.pattern }}" >> "$GITHUB_STEP_SUMMARY"
          echo "retry_skip=${{ steps.retryguard.outputs.skip }}" >> "$GITHUB_STEP_SUMMARY"
          echo "changed=${{ steps.diffcheck.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
